# S3 properties file

#######################################################################################################
# Default Labels for XPage
sthree.pageTitle=sthree
sthree.pagePathLabel=sthree

# Default partSize for upload when content length unavailable (A valid part size is between 5MiB to 5GiB (both limits inclusive)
sthree.default.partSize=10485760

#######################################################################################################
# S3 connection configuration
s3Url=
s3Bucket=
s3Key=
s3Password=

# S3 default file path
# You can add the following variables to the path:
# {YYYY} -> Add the upload year
# {MM} -> Add the upload month
# {DD} -> Add the upload day
# {HH} -> Add the upload hour
# {mm} -> Add the upload minutes
# {ss} -> Add the upload seconds
# {UUID} -> Add an uuid
# {code} -> Add the site code
# / -> Folder separator
s3DefaultFilePath={YYYY}/{MM}-{DD}/{code}-{HH}-{mm}-{ss}-{UUID}

# Default to 'true' if empty, when using a non Amazon S3 instance, it is recommanded to leave this empty.
s3ForcePathStyle=

# Default to AWS_GLOBAL, when using a non Amazon S3 instance, it is recommanded to leave this empty.
# Region list : https://docs.aws.amazon.com/general/latest/gr/rande.html
s3Region=

# Default to CRC32, when using a non Amazon S3 instance, it is recommanded to leave this empty.
# Checksum Algorithm list : CRC32, CRC32C, SHA1, SHA256 (an unknown value falls back to CRC32).
# To deactivate checksum calculation, set it to "DISABLED".
s3ChecksumAlgorithm=

# Proxy configuration
s3ProxyHost=
s3ProxyUsername=
s3ProxyPassword=

# Timeout settings in seconds, leave empty for default timeout values.
s3RequestTimeout=
s3ConnectionTimeout=

# Label of the file store service provider shown by the back office screens that read the convention
# filestore.<provider name>.label (plugin-filestoragetransfer): a text or an #i18n{key}
filestore.s3StorageFileService.label=#i18n{sthree.filestore.s3StorageFileService.label}

# Bean names of the services used by the S3 file store service provider
sthree.s3StorageFileService.downloadService=sthree.s3FileDownloadUrlService
sthree.s3StorageFileService.rbacService=defaultFileRBACService

#######################################################################################################
# Several S3 instances (servers or buckets) side by side
# List their ids here; each one is then configured by the keys sthree.instance.<id>.<setting>, with the same settings
# as the single instance above (url, bucket, key, password, defaultFilePath, forcePathStyle, region, checksumAlgorithm,
# proxyHost, proxyUsername, proxyPassword, requestTimeout, connectionTimeout, downloadService, rbacService) and a name.
# When this list is not empty, the single instance above (s3StorageFileService) is not created.
# An instance without url or bucket, or whose name is already used, is ignored and reported in the log at startup.
sthree.instances=
#sthree.instances=courant,archives
#sthree.instance.archives.name=s3-archives
#sthree.instance.archives.url=https://s3.example.org
#sthree.instance.archives.bucket=archives
#sthree.instance.archives.key=
#sthree.instance.archives.password=
